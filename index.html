<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>贪吃蛇 · Snake</title>
<meta name="theme-color" content="#101923" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="贪吃蛇" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
<style>
  :root {
    --accent: #22d3ee; --bg: #101923; --board: #101e2a; --panel: #172732;
    --text: #e7f2f3; --subtext: #a4bac1; --border: #354b57; --hover: #203743;
    --ghost: #93cbd8; --food: #ee8193; --special: #e8c879; --overlay: rgba(7,17,24,.60);
    --radius: 8px; --board-size: 600px;
    --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    color: var(--text); background: var(--bg); display: flex; align-items: center;
    justify-content: center; height: 100dvh; padding: 12px; min-height: 0;
    padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
    font-size: 14px; line-height: 1.5;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hidden { display: none !important; }
  .icon-library { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; width: var(--board-size); flex: 0 0 auto; max-height: 100%; }
  #hud { display: flex; align-items: center; width: var(--board-size); height: 56px; gap: 18px; flex: 0 0 auto; }
  .stats { display: flex; align-items: center; gap: 22px; min-width: 0; flex: 1; }
  .stat { display: flex; flex-direction: column; gap: 0; white-space: nowrap; }
  .label, .section-label { font-size: 12px; color: var(--subtext); }
  .value, .number, .lb-score, .lb-time, .lb-rank, #go-score, #countdown-num {
    font-family: "Cascadia Mono", Consolas, "SFMono-Regular", monospace; font-variant-numeric: tabular-nums;
  }
  .stat .value { font-size: 14px; line-height: 1.5; }
  .stat-score .value { font-size: 30px; line-height: 1.1; color: var(--accent); font-weight: 700; }
  #difficulty { font-family: inherit; }
  .hud-actions { display: flex; gap: 6px; }
  .icon-btn, .btn, .dpad-btn { border: 1px solid var(--border); border-radius: var(--radius); background: transparent; box-shadow: none; transition: background-color 120ms, border-color 120ms, transform 80ms; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; color: var(--subtext); }
  .icon-btn:disabled { opacity: .4; cursor: default; }
  .icon-play, .icon-sound-off { display: none; }
  #app[data-state="paused"] .icon-pause, .is-muted .icon-sound-on { display: none; }
  #app[data-state="paused"] .icon-play, .is-muted .icon-sound-off { display: block; }
  .btn { min-height: 44px; padding: 10px 18px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  @media (hover: hover) {
    .btn:hover, .icon-btn:not(:disabled):hover, .dpad-btn:hover { background: var(--hover); border-color: var(--subtext); }
    .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); border-color: var(--accent); }
  }
  .btn:active, .icon-btn:not(:disabled):active, .dpad-btn:active { transform: translateY(1px); }
  .btn-group { display: flex; gap: 8px; }
  #status-strip { width: var(--board-size); height: 60px; flex: 0 0 auto; }
  .status-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; height: 36px; }
  .status-slot { min-width: 0; visibility: hidden; color: var(--subtext); font-size: 12px; }
  .status-slot.active { visibility: visible; }
  .status-label { height: 22px; display: flex; align-items: center; justify-content: space-between; gap: 4px; white-space: nowrap; }
  .status-label strong { font-weight: 500; color: var(--accent); }
  #ghost-badge .status-label strong { color: var(--ghost); }
  #special-badge .status-label strong { color: var(--special); }
  .status-meter { display: block; height: 2px; width: 100%; background: var(--border); }
  .status-meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  #ghost-badge .status-meter i { background: var(--ghost); }
  #special-badge .status-meter i { background: var(--special); }
  .reward-line { height: 24px; display: flex; align-items: center; justify-content: center; }
  #reward-toast { visibility: hidden; font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
  #reward-toast.show { visibility: visible; }
  #board-wrap { position: relative; width: var(--board-size); height: var(--board-size); border-radius: var(--radius); overflow: hidden; flex: 0 0 auto; background: var(--board); line-height: 0; }
  #board-wrap::after { content: ''; position: absolute; inset: 0; border: 1px solid var(--border); border-radius: inherit; pointer-events: none; z-index: 20; }
  #board-wrap.has-ghost::after { border-color: var(--ghost); border-style: dashed; }
  #game { display: block; touch-action: none; }
  .overlay { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 18px; line-height: 1.5; background: var(--overlay); }
  .result-panel, .pause-panel { width: min(100%, 320px); padding: 24px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); text-align: center; }
  .result-title, .pause-title { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .subtitle { color: var(--subtext); font-size: 13px; }
  #result-reason { margin-top: 4px; }
  .result-score { margin: 16px 0 10px; }
  .result-score .label { display: block; }
  #go-score { display: block; color: var(--accent); font-size: 52px; font-weight: 700; line-height: 1.2; }
  .result-meta { display: flex; justify-content: center; gap: 20px; color: var(--subtext); font-size: 12px; }
  .result-meta .number { color: var(--text); margin-left: 4px; }
  .record-badge { display: none; color: var(--accent); font-size: 12px; }
  .record-badge.show { display: block; }
  .result-actions { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
  .result-actions .btn { width: 100%; }
  #btn-menu { border-color: transparent; color: var(--subtext); }
  .pause-panel .subtitle { margin: 8px 0 20px; }
  .pause-actions { display: grid; gap: 8px; }
  #overlay-countdown { background: transparent; align-items: flex-start; padding-top: 12%; pointer-events: none; }
  .countdown-display { text-align: center; padding: 8px 24px; border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius); }
  #countdown-num { font-size: 48px; line-height: 1.2; font-weight: 700; color: var(--accent); }
  #app[data-state="gameover"] .stats { visibility: hidden; }
  #app[data-state="gameover"] .status-slot, #app[data-state="gameover"] .reward-line { visibility: hidden; }
  #app[data-state="gameover"] #reward-toast { visibility: hidden; }
  #app.compact-board #overlay-gameover { position: fixed; z-index: 40; inset: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
  #app.compact-board .status-detail { display: none; }
  #overlay-menu {
    position: fixed; inset: auto; left: calc((100vw + var(--safe-left) - var(--safe-right)) / 2); top: calc((100dvh + var(--safe-top) - var(--safe-bottom)) / 2); transform: translate(-50%, -50%);
    width: min(620px, calc(100vw - 24px - var(--safe-left) - var(--safe-right))); height: auto; max-height: calc(100dvh - 24px - var(--safe-top) - var(--safe-bottom));
    display: block; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin;
    scrollbar-color: var(--border) var(--board); padding: 0; z-index: 30;
    background: var(--board); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: inset 0 0 0 5px var(--board), inset 0 0 0 6px var(--border);
  }
  #menu-snake { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .menu-card { position: relative; z-index: 1; width: 100%; padding: 76px 48px 28px 72px; }
  .menu-heading { margin: 0 0 22px; text-align: center; }
  .menu-heading h1 { line-height: 0; margin: 0 auto; width: min(100%, 350px); }
  #menu-wordmark { display: block; width: 100%; height: auto; overflow: visible; color: var(--text); }
  .menu-edition { display: block; color: var(--subtext); font-size: 12px; letter-spacing: .12em; margin-top: 10px; }
  .menu-settings { display: grid; gap: 18px; }
  .section-label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; color: var(--text); }
  #diff-group, #theme-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .diff-btn { min-width: 0; padding: 9px 2px; font-size: 14px; font-weight: 500; background: var(--board); }
  .diff-btn small { color: var(--subtext); margin-left: 5px; font-size: 12px; font-weight: 400; }
  .diff-btn.active { border-color: var(--accent); color: var(--accent); background: var(--panel); }
  .theme-btn { position: relative; display: flex; flex-direction: column; align-items: stretch; padding: 6px; gap: 6px; min-width: 0; font-weight: 500; font-size: 13px; overflow: hidden; background: var(--board); }
  .theme-preview { width: 100%; height: 65px; display: block; border-radius: 2px; image-rendering: pixelated; }
  .theme-btn.active { border-color: var(--accent); background: var(--panel); color: var(--accent); }
  .theme-name { padding: 0 3px 2px; display: flex; justify-content: space-between; align-items: center; }
  .selected-mark { width: 15px; height: 15px; visibility: hidden; }
  .theme-btn.active .selected-mark { visibility: visible; }
  .menu-start { margin-top: 20px; }
  #btn-start { width: 100%; min-height: 48px; font-size: 18px; letter-spacing: .04em; }
  .hint { color: var(--subtext); font-size: 12px; text-align: center; margin-top: 9px; }
  .hint-touch { display: none; }
  .touch .hint-keyboard { display: none; }
  .touch .hint-touch { display: inline; }
  .leaderboard { margin-top: 22px; border: 1px solid var(--border); background: var(--board); border-radius: var(--radius); padding: 12px 14px; }
  .lb-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .lb-title { font-size: 13px; color: var(--text); font-weight: 600; }
  #btn-lb-all { border: 0; color: var(--subtext); padding: 4px 0 4px 12px; font-size: 12px; background: transparent; }
  #btn-lb-all:hover { color: var(--accent); }
  .lb-row { display: grid; grid-template-columns: 14px 1fr 34px 42px 72px; align-items: center; gap: 7px; min-height: 28px; font-size: 12px; color: var(--subtext); border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent); }
  .lb-score { color: var(--text); font-weight: 600; }
  .lb-date { text-align: right; font-variant-numeric: tabular-nums; }
  .lb-empty { font-size: 12px; color: var(--subtext); padding: 10px 0; }
  #app[data-state="menu"] #hud, #app[data-state="menu"] #status-strip { visibility: hidden; }
  #berry-cursor { position: fixed; top: 0; left: 0; width: 26px; height: 30px; pointer-events: none; z-index: 1000; display: none; color: var(--food); }
  #berry-cursor.visible { display: block; }
  #overlay-menu.has-berry-cursor, #overlay-menu.has-berry-cursor * { cursor: none !important; }
  @media (max-height: 760px) and (min-width: 481px) {
    .menu-card { padding-top: 62px; padding-bottom: 20px; }
    .menu-heading { margin-bottom: 16px; }
    .menu-heading h1 { width: 300px; }
    .menu-settings { gap: 12px; }
    .theme-preview { height: 48px; }
    .menu-start { margin-top: 16px; }
    .leaderboard { margin-top: 16px; padding-top: 8px; padding-bottom: 8px; }
  }
  #touch-hint { display: none; font-size: 12px; color: var(--subtext); height: 18px; flex: 0 0 auto; }
  #touch-controls { display: none; grid-template-columns: repeat(3,44px); grid-template-rows: repeat(2,44px); gap: 6px; flex: 0 0 auto; }
  .touch #touch-hint { display: block; }
  .touch #touch-controls { display: grid; }
  .dpad-btn { color: var(--subtext); width: 44px; height: 44px; display: grid; place-items: center; user-select: none; touch-action: none; }
  .dpad-up { grid-column: 2; grid-row: 1; } .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 2; } .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-left .icon { transform: rotate(-90deg); } .dpad-down .icon { transform: rotate(180deg); } .dpad-right .icon { transform: rotate(90deg); }
  #app[data-state="menu"] #touch-controls, #app[data-state="menu"] #touch-hint { visibility: hidden; }
  body[data-theme="pixel"] { --radius: 2px; }
  body[data-theme="pixel"] canvas { image-rendering: pixelated; }
  body[data-theme="pixel"] .selected-mark, body[data-theme="pixel"] .icon { stroke-linecap: square; stroke-linejoin: miter; }
  #orientation-hint { display: none; }
  @media (max-width: 480px) {
    body { padding: calc(8px + var(--safe-top)) calc(8px + var(--safe-right)) calc(8px + var(--safe-bottom)) calc(8px + var(--safe-left)); }
    #hud { gap: 8px; }
    .stats { gap: 14px; }
    .hud-actions { gap: 4px; }
    .icon-btn { width: 36px; height: 40px; }
    .menu-card { padding: 44px 16px 12px 36px; }
    .menu-heading { margin-bottom: 12px; }
    .menu-heading h1 { width: 230px; max-width: 100%; }
    .menu-edition { margin-top: 5px; }
    .theme-preview { height: 42px; }
    .menu-start { margin-top: 12px; }
    .leaderboard { margin-top: 12px; padding: 8px; }
    .lb-row { min-height: 25px; }
    .menu-heading h1 { font-size: 24px; }

    .diff-btn small { display: block; margin: 0; }
    .diff-btn { padding: 5px 2px; }
    .menu-settings { gap: 10px; }
    .result-panel, .pause-panel { padding: 18px; }
    .result-title, .pause-title { font-size: 20px; }
    .result-score { margin: 10px 0 8px; }
    #go-score { font-size: 44px; }
    .result-actions { margin-top: 12px; gap: 4px; }
    .result-actions .btn { min-height: 40px; padding: 8px 12px; }
    .status-grid { gap: 8px; }
    .lb-row { gap: 5px; grid-template-columns: 14px 1fr 32px 40px 68px; }
  }
  @media (max-width: 480px) and (max-height: 620px) {
    .menu-card { padding-top: 40px; }
    .menu-heading { margin-bottom: 8px; }
    .menu-edition { margin-top: 3px; }
    .section-label { margin-bottom: 4px; line-height: 1.3; }
    .theme-preview { height: 32px; }
    .theme-btn { gap: 4px; }
    .lb-row { min-height: 22px; }
    .leaderboard { margin-top: 8px; }
  }
  @media (orientation: landscape) and (max-height: 600px) {
    .touch #app { padding-right: 170px; width: calc(var(--board-size) + 170px); }
    .touch #touch-controls { position: absolute; right: 6px; top: 50%; transform: translateY(-20%); }
    .touch #touch-hint { position: absolute; width: 152px; text-align: center; right: 0; top: calc(50% - 38px); height: auto; }
    #overlay-menu { width: min(720px, calc(100vw - 20px - var(--safe-left) - var(--safe-right))); padding: 0; }
    .menu-card { display: grid; grid-template-columns: 1.3fr 1fr; column-gap: 24px; padding: 48px 28px 18px 52px; }
    .menu-heading { grid-column: 1; margin-bottom: 12px; }
    .menu-heading h1 { width: 220px; }
    .menu-edition { margin-top: 4px; }
    .menu-settings { grid-column: 1; grid-row: 2 / 4; gap: 8px; }
    .menu-start { grid-column: 2; grid-row: 1; margin-top: 8px; }
    .leaderboard { grid-column: 2; grid-row: 2 / 4; margin-top: 0; padding: 8px; align-self: start; }
    .diff-btn small { display: none; }
    .theme-preview { height: 28px; }
    #app { gap: 4px; }
    #hud { height: 48px; }
    #status-strip { height: 50px; }
    .status-grid { height: 30px; }
    .reward-line { height: 20px; }
    .overlay { padding: 10px; }
    .result-panel, .pause-panel { padding: 12px; }
    .result-title, .pause-title { font-size: 18px; }
    .result-score { margin: 2px 0; }
    #go-score { font-size: 34px; }
    .result-actions { margin-top: 8px; gap: 4px; }
    .result-actions .btn { padding: 5px 10px; min-height: 34px; }
    .pause-panel .subtitle { margin: 4px 0 10px; }
    .pause-actions { gap: 4px; }
    .pause-actions .btn { min-height: 36px; padding: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .btn:active, .icon-btn:active, .dpad-btn:active { transform: none; }
  }

  .pwa-panel { grid-column: 1 / -1; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--subtext); font-size: 12px; line-height: 1.6; }
  .pwa-panel summary { cursor: pointer; color: var(--text); min-height: 44px; display: flex; align-items: center; gap: 8px; width: fit-content; }
  .pwa-panel summary::before { content: '+'; color: var(--accent); font-size: 18px; }
  .pwa-panel details[open] summary::before { content: '−'; }
  .pwa-panel summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pwa-panel p { margin: 4px 0; }
  .pwa-panel .btn { margin: 6px 0; font-size: 12px; }
  .pwa-panel [hidden] { display: none !important; }
  #pwa-status[data-ready="true"]::before { content: '✓ '; color: var(--accent); }
</style>
</head>
<body data-theme="neon">
<svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-muted" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4ZM16 9l6 6m0-6-6 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m6 11 6-6 6 6M12 5v14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>
<main id="app" data-state="menu">
  <header id="hud" aria-label="游戏信息">
    <div class="stats">
      <div class="stat stat-score"><span class="label">分数</span><span class="value" id="score">0</span></div>
      <div class="stat"><span class="label">最高分</span><span class="value" id="highscore">0</span></div>
      <div class="stat"><span class="label">难度</span><span class="value" id="difficulty">普通</span></div>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="btn-pause" title="暂停 / 继续（空格）" aria-label="暂停游戏"><svg class="icon icon-pause"><use href="#i-pause"/></svg><svg class="icon icon-play"><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="btn-mute" title="关闭声音" aria-label="静音" aria-pressed="false"><svg class="icon icon-sound-on"><use href="#i-volume"/></svg><svg class="icon icon-sound-off"><use href="#i-muted"/></svg></button>
    </div>
  </header>
  <div id="status-strip" aria-label="连吃与限时状态">
    <div class="status-grid">
      <div class="status-slot" id="combo-badge"><div class="status-label"><strong>连吃 <span id="combo-count" class="number">1</span></strong><span class="number" id="combo-time"></span></div><span class="status-meter"><i id="combo-meter"></i></span></div>
      <div class="status-slot" id="ghost-badge"><div class="status-label"><strong>幽灵</strong><span class="number" id="ghost-time"></span></div><span class="status-meter"><i id="ghost-meter"></i></span></div>
      <div class="status-slot" id="special-badge"><div class="status-label"><strong>星形<span class="status-detail">道具</span></strong><span class="number" id="special-time"></span></div><span class="status-meter"><i id="special-meter"></i></span></div>
    </div>
    <div class="reward-line"><span id="reward-toast" role="status" aria-live="polite" aria-atomic="true"></span></div>
  </div>
  <div id="board-wrap">
    <canvas id="game" aria-label="贪吃蛇棋盘，使用方向键、WASD 或触控转向"></canvas>
    <div class="overlay hidden" id="overlay-countdown"><div class="countdown-display"><div id="countdown-num">3</div><div class="subtitle">准备出发</div></div></div>
    <div class="overlay hidden" id="overlay-pause">
      <section class="pause-panel" aria-label="暂停菜单"><h2 class="pause-title">已暂停</h2><p class="subtitle">准备好了，就继续前进</p>
        <div class="pause-actions"><button class="btn primary" id="btn-resume">继续游戏</button><button class="btn" id="btn-restart-from-pause">重新开始</button><button class="btn" id="btn-menu-from-pause">返回菜单</button></div>
      </section>
