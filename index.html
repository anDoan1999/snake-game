<script>
'use strict';

/* ============================================================
 * 集中配置：所有可调参数集中在此管理，方便后续扩展
 * ============================================================ */
const CONFIG = {
  grid: 20,                       // 网格 20 × 20
  canvas: { min: 300, max: 600, floor: 200 }, // 画布尺寸范围（floor 为极端小屏下限）
  // 各难度：每秒移动步数 / 障碍物数量 / 是否可穿墙
  speeds:    { easy: 6,  normal: 10, hard: 15 },
  obstacles: { easy: 0,  normal: 0,  hard: 8  },
  wallPass:  { easy: true, normal: false, hard: false },
  scoring: {
    normal: 10,                   // 普通食物基础分
    special: 30,                  // 特殊食物基础分
    comboBonus: 10,               // 每连击额外 = comboBonus × 连击数
    comboMax: 5,                  // 连击倍率上限
    comboWindowMs: 10000          // 连击判定窗口 10 秒
  },
  specialFood: {
    every: 5,                     // 每吃满 N 个普通食物触发一次特殊食物
    lifetime: 8000                // 特殊食物存在时长 8 秒
  },
  ghost: {
    every: 5,                     // 每吃 N 个食物（含特殊）触发一次幽灵模式
    durationMs: 3000              // 幽灵模式持续 3 秒
  },
  particles: { max: 6 },        // 粒子数量上限（对象池固定容量）
  countdownMs: 3000               // 开局倒计时 3 秒
};

/* ============================================================
 * 三套皮肤主题
 * ============================================================ */
const THEMES = {
  neon: {
    name: '霓虹', caption: '霓虹 · 夜行', bg: '#101e2a', page: '#101923', panel: '#172732',
    text: '#e7f2f3', subtext: '#a4bac1', border: '#354b57', hover: '#203743', overlay: 'rgba(7,17,24,.60)',
    grid: 'rgba(117,175,192,.065)', accent: '#22d3ee', ghost: '#93cbd8', glow: true,
    snake: { head: '#22d3ee', mid: '#19b5cc', tail: '#287d90', eye: '#101923', eyeWhite: '#f2f7f4' },
    food: '#ee8193', special: '#e8c879', obstacle: '#455b6a', obstacleEdge: '#78909c', pixelStyle: false
  },
  pixel: {
    name: '像素', caption: '像素 · 经典', bg: '#232b26', page: '#171c1a', panel: '#28312b',
    text: '#f2ebdd', subtext: '#aab5ac', border: '#4b574c', hover: '#354034', overlay: 'rgba(13,18,15,.58)',
    grid: 'rgba(190,191,157,.07)', accent: '#e9b85f', ghost: '#b7d4c4', glow: false,
    snake: { head: '#e9b85f', mid: '#dca25c', tail: '#be7e49', eye: '#28261e', eyeWhite: '#f2ebdd' },
    food: '#e97862', special: '#81bead', obstacle: '#626850', obstacleEdge: '#969c7c', pixelStyle: true
  },
  forest: {
    name: '森林', caption: '森林 · 漫游', bg: '#202e25', page: '#142219', panel: '#26392c',
    text: '#f0ecdc', subtext: '#afbeaa', border: '#4a634d', hover: '#344a35', overlay: 'rgba(10,22,14,.56)',
    grid: 'rgba(177,191,150,.065)', accent: '#b7cb84', ghost: '#c5d8bb', glow: false,
    snake: { head: '#b7cb84', mid: '#96b174', tail: '#68864f', eye: '#24311e', eyeWhite: '#f0ecdc' },
    food: '#d88998', special: '#e1c58d', obstacle: '#657464', obstacleEdge: '#95a18a', pixelStyle: false
  }
};

const DIFF_NAMES = { easy: '简单', normal: '普通', hard: '困难' };
const DIFF_CLASSES = { easy: 'diff-easy', normal: 'diff-normal', hard: 'diff-hard' };
const DIRECTIONS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0 }
};

/* ============================================================
 * 本地持久化：最高分 / 最近 5 局排行榜 / 皮肤选择
 * ============================================================ */
const Storage = {
  KEY_HIGH: 'snake_highscore', KEY_LB: 'snake_leaderboard', KEY_THEME: 'snake_theme',
  highscore: 0, leaderboard: [], theme: 'neon',
  load() {
    this.highscore = this._get(this.KEY_HIGH, 0);
    this.leaderboard = this._get(this.KEY_LB, []);
    if (!Array.isArray(this.leaderboard)) this.leaderboard = [];
    this.leaderboard = this.leaderboard.filter(e => e && Number.isFinite(e.score) && Number.isFinite(e.time) && DIFF_NAMES[e.difficulty]);
    this.highscores = this._get('snake_highscores_by_difficulty', {});
    if (!this.highscores || typeof this.highscores !== 'object' || Array.isArray(this.highscores)) this.highscores = {};
    for (const e of this.leaderboard) this.highscores[e.difficulty] = Math.max(this.best(e.difficulty), e.score);
    this.theme = this._get(this.KEY_THEME, 'neon');
  },
  best(difficulty) { const n = this.highscores?.[difficulty]; return Number.isFinite(n) && n >= 0 ? n : 0; },
  saveScore(score, time, difficulty) {
    this.highscores[difficulty] = Math.max(this.best(difficulty), score);
    this._set('snake_highscores_by_difficulty', this.highscores);
    if (score > this.highscore) { this.highscore = score; this._set(this.KEY_HIGH, score); }
    this.leaderboard.unshift({ score, time: Math.round(time), difficulty, date: Date.now() });
    this.leaderboard = this.leaderboard.slice(0, 5);
    this._set(this.KEY_LB, this.leaderboard);
  },
  saveTheme(name) { this.theme = name; this._set(this.KEY_THEME, name); },
  _get(key, def) {
    try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); }
    catch (e) { return def; }
  },
  _set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
};

/* ============================================================
 * 工具函数
 * ============================================================ */
function hexToRgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function formatTime(s) {
  s = Math.max(0, Math.floor(s));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function formatDate(ts) {
  const d = new Date(ts);
  return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(ctx, cx, cy, outer, inner, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = (i % 2 === 0) ? outer : inner;
    const a = -Math.PI / 2 + (i * Math.PI) / points;
    if (i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath();
}

/* ============================================================
 * 音效系统（Web Audio API，无外部资源）
 * ============================================================ */
class AudioManager {
  constructor() { this.ctx = null; this.enabled = true; this.countdownNote = null; }
  ensure() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.ctx && AC) this.ctx = new AC();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  }
  _beep(freq, dur, type, vol, endFreq) {
    if (!this.ctx || !this.enabled) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.onended = () => {
      osc.disconnect(); gain.disconnect();
      if (this.countdownNote?.osc === osc) this.countdownNote = null;
    };
    osc.start(t0); osc.stop(t0 + dur);
    return { osc, gain };
  }
  countdown(number) {
    this.stopCountdown();
    this.countdownNote = number > 0
      ? this._beep(660, 0.10, 'sine', 0.075)
      : this._beep(990, 0.18, 'sine', 0.09);
  }
  stopCountdown() {
    if (!this.countdownNote) return;
    const { osc, gain } = this.countdownNote;
    gain.gain.cancelScheduledValues(this.ctx.currentTime);
    gain.gain.setValueAtTime(0, this.ctx.currentTime);
    osc.stop(this.ctx.currentTime);
    this.countdownNote = null;
  }
  move()    { this._beep(150, 0.05, 'square', 0.025); }
  eat(combo){ const base = 440 + Math.min(combo || 1, 5) * 60;
              this._beep(base, 0.09, 'sine', 0.12);
              this._beep(base * 1.5, 0.12, 'sine', 0.1); }
  special() { this._beep(660, 0.08, 'sine', 0.12);
              setTimeout(() => this._beep(880, 0.08, 'sine', 0.12), 80);
              setTimeout(() => this._beep(1320, 0.14, 'sine', 0.1), 160); }
  ghost()   { this._beep(200, 0.28, 'sine', 0.12, 620); }
  death()   { this._beep(320, 0.45, 'sawtooth', 0.15, 60); }
  click()   { this._beep(500, 0.05, 'square', 0.05); }
}

/* ============================================================
 * 粒子系统：固定容量对象池，避免内存泄漏与数量失控
 * ============================================================ */
class ParticleSystem {
  constructor(max) {
    this.max = Math.min(6, max);
    this.pool = [];
    for (let i = 0; i < this.max; i++)
      this.pool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 2, color: '#fff' });
  }
  burst(x, y, color, count = 6) {
    // A new bite replaces the previous burst, keeping a fixed six-particle limit.
    this.clear();
    const total = Math.min(this.max, Math.max(0, count));
    for (let i = 0; i < total; i++) {
      const p = this.pool[i];
      const angle = (i / total) * Math.PI * 2 + Math.random() * 0.3;
      const speed = 24 + Math.random() * 28;
      p.active = true; p.x = x; p.y = y;
      p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed;
      p.maxLife = 180 + Math.random() * 70; p.life = p.maxLife;
      p.size = 2 + Math.floor(Math.random() * 2); p.color = color;
    }
  }
  update(dt) {
    for (const p of this.pool) {
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) { p.active = false; continue; }
      p.x += (p.vx * dt) / 1000;
      p.y += (p.vy * dt) / 1000;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowBlur = 0;
    for (const p of this.pool) {
      if (!p.active) continue;
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1) * 0.8;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x - p.size / 2), Math.round(p.y - p.size / 2), p.size, p.size);
    }
    ctx.restore();
  }
  clear() { for (const p of this.pool) p.active = false; }
}

/* ============================================================
 * Snake 类：蛇的逻辑（方向队列、移动、增长、碰撞检测）
 * ============================================================ */
class Snake {
  constructor() {
    const c = Math.floor(CONFIG.grid / 2);
    this.body = [{ x: c, y: c }, { x: c - 1, y: c }, { x: c - 2, y: c }]; // body[0] 为蛇头
    this.direction = DIRECTIONS.right;
    this.dirQueue = [];     // 方向输入队列（最多 2 个，用于平滑转弯）
    this.pendingGrowth = 0; // 待增长节数
  }

  /** 入队方向：入队时做一次反向校验（最终防线在 _applyNextDirection） */
  queueDirection(d) {
    const last = this.dirQueue.length ? this.dirQueue[this.dirQueue.length - 1] : this.direction;
    if ((d.x === -last.x && d.y === -last.y) || (d.x === last.x && d.y === last.y)) return;
    if (this.dirQueue.length < 2) this.dirQueue.push(d);
  }

  /** 应用下一个方向：应用前再次校验，彻底杜绝快速按键导致的反向移动 */
  _applyNextDirection() {
    while (this.dirQueue.length) {
      const d = this.dirQueue[0];
      // 丢弃与当前方向相同或相反的方向，只取第一个合法（垂直）方向
      if (d.x === this.direction.x && d.y === this.direction.y) { this.dirQueue.shift(); continue; }
      if (d.x === -this.direction.x && d.y === -this.direction.y) { this.dirQueue.shift(); continue; }
      this.direction = this.dirQueue.shift();
      break;
    }
  }

  /**
   * 前进一步。参数：
   * @param {Array} obstacles 障碍物坐标数组
   * @param {boolean} wrap 是否可穿墙（环绕）
   * @param {boolean} ghost 幽灵模式（无敌，忽略自撞/障碍/墙壁死亡）
   * @param {Food} food 食物对象（用于判定是否吃到）
   * @returns {string} 'moved' | 'wall' | 'self' | 'obstacle' | 'food' | 'special'
   */
  move(obstacles, wrap, ghost, food) {
    this._applyNextDirection();
    const g = CONFIG.grid;
    let nx = this.body[0].x + this.direction.x;
    let ny = this.body[0].y + this.direction.y;

    if (wrap || ghost) {
      nx = (nx + g) % g;
      ny = (ny + g) % g;
    } else if (nx < 0 || nx >= g || ny < 0 || ny >= g) {
      return 'wall';
    }

    if (!ghost) {
      // 若本步不增长，尾部将移走，因此撞尾格不算自撞
      const willGrow = this.pendingGrowth > 0;
      const checkBody = willGrow ? this.body : this.body.slice(0, -1);
      for (const s of checkBody) if (s.x === nx && s.y === ny) return 'self';
      for (const o of obstacles) if (o.x === nx && o.y === ny) return 'obstacle';
    }

    this.body.unshift({ x: nx, y: ny });
    if (this.pendingGrowth > 0) this.pendingGrowth--;
    else this.body.pop();

    // 判定是否吃到食物（食物仍在原坐标，由 Game 随后处理移除/再生）
    if (food.food && nx === food.food.x && ny === food.food.y) return 'food';
    if (food.special && nx === food.special.x && ny === food.special.y) return 'special';
    return 'moved';
  }
}

/* ============================================================
 * Food 类：食物生成（普通食物 + 特殊食物）
 * ============================================================ */
class Food {
  constructor() {
    this.food = null;            // 普通食物坐标
    this.special = null;         // 特殊食物坐标
    this.specialRemaining = 0;   // 特殊食物剩余存在时间（dt 递减，暂停时冻结）
    this.foodsEaten = 0;         // 已吃普通食物数（用于触发特殊食物）
  }
  reset() { this.food = null; this.special = null; this.specialRemaining = 0; this.foodsEaten = 0; }

  /** 生成占位集合：障碍物 + 已有食物 + 蛇身 */
  _occupied(snake, obstacles) {
    const set = new Set();
    for (const o of obstacles) set.add(o.x + ',' + o.y);
    if (this.food) set.add(this.food.x + ',' + this.food.y);
    if (this.special) set.add(this.special.x + ',' + this.special.y);
    for (const s of snake.body) set.add(s.x + ',' + s.y);
    return set;
  }
  /** 随机取一个空单元格 */
  _freeCell(snake, obstacles) {
    const occ = this._occupied(snake, obstacles);
    const free = [];
    for (let x = 0; x < CONFIG.grid; x++)
      for (let y = 0; y < CONFIG.grid; y++)
        if (!occ.has(x + ',' + y)) free.push({ x, y });
    if (!free.length) return null;
    return free[Math.floor(Math.random() * free.length)];
  }
  generate(snake, obstacles) {
    const c = this._freeCell(snake, obstacles);
    if (c) this.food = c;
  }
  spawnSpecial(snake, obstacles) {
    const c = this._freeCell(snake, obstacles);
    if (c) { this.special = c; this.specialRemaining = CONFIG.specialFood.lifetime; }
  }
  /** 每帧调用（仅游戏进行时），处理特殊食物过期 */
  update(dt) {
    if (this.special) {
      this.specialRemaining -= dt;
      if (this.specialRemaining <= 0) this.special = null;
    }
  }
  onNormalEaten(snake, obstacles) {
    this.food = null;
    this.foodsEaten++;
    this.generate(snake, obstacles);
    if (this.foodsEaten % CONFIG.specialFood.every === 0) this.spawnSpecial(snake, obstacles);
  }
  onSpecialEaten() { this.special = null; this.specialRemaining = 0; }
}

/* ============================================================
 * Renderer 类：绘制与特效（背景、网格、蛇、食物、粒子）
 * ============================================================ */
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cellSize = 15;
    this.boardSize = 300;
    this.particles = new ParticleSystem(CONFIG.particles.max);
    this.reducedMotion = false;
    this.headPulseStarted = -Infinity;
  }
  /** Set canvas dimensions and the device-pixel transform. */
  resize(cellSize, boardSize, dpr) {
    this.cellSize = cellSize;
    this.boardSize = boardSize;
    this.canvas.style.width = boardSize + 'px';
    this.canvas.style.height = boardSize + 'px';
    this.canvas.width = boardSize * dpr;
    this.canvas.height = boardSize * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  burst(x, y, color, count) {
    if (this.reducedMotion) return;
    this.particles.burst(x, y, color, count);
  }
  pulseHead() { this.headPulseStarted = this.reducedMotion ? -Infinity : performance.now(); }
  updateParticles(dt) {
    if (this.reducedMotion) this.clearParticles();
    else this.particles.update(dt);
  }
  clearParticles() { this.particles.clear(); this.headPulseStarted = -Infinity; }

  /** view may override reducedMotion; the animation clock never changes the model. */
  render(now, view) {
    const { theme, snake, food, obstacles, ghostActive } = view;
    if (typeof view.reducedMotion === 'boolean') this.reducedMotion = view.reducedMotion;
    if (this.reducedMotion) this.clearParticles();
    const ctx = this.ctx, cell = this.cellSize, size = this.boardSize;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.imageSmoothingEnabled = !theme.pixelStyle;
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, size, size);

    // A static, low-contrast grid keeps the moving blocks easy to follow.
    ctx.strokeStyle = theme.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < CONFIG.grid; i++) {
      ctx.moveTo(i * cell + 0.5, 0); ctx.lineTo(i * cell + 0.5, size);
      ctx.moveTo(0, i * cell + 0.5); ctx.lineTo(size, i * cell + 0.5);
    }
    ctx.stroke();

    this._drawObstacles(obstacles, cell, theme);
    this._drawFood(food, cell, theme);
    this._drawSpecial(food, cell, theme);
    this._drawSnake(snake, cell, theme, ghostActive, view.now ?? now);
    if (ghostActive) {
      ctx.save();
      ctx.strokeStyle = theme.ghost || theme.accent;
      ctx.globalAlpha = 0.75;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 5]);
      ctx.strokeRect(2.5, 2.5, size - 5, size - 5);
      ctx.restore();
    }
    this.particles.draw(ctx);
    ctx.restore();
  }

  _drawObstacles(obstacles, cell, theme) {
    const ctx = this.ctx, inset = Math.max(1, Math.round(cell * 0.1));
    for (const o of obstacles) {
      const x = o.x * cell + inset, y = o.y * cell + inset, size = cell - inset * 2;
      ctx.fillStyle = theme.obstacle;
      ctx.fillRect(x, y, size, size);
      ctx.strokeStyle = theme.obstacleEdge || theme.grid;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      ctx.fillStyle = theme.obstacleEdge || theme.grid;
      ctx.fillRect(x + 2, y + 2, Math.max(1, Math.round(size * 0.3)), 1);
    }
  }

  _drawFood(food, cell, theme) {
    const f = food.food;
    if (!f) return;
    const ctx = this.ctx;
    const cx = f.x * cell + cell / 2, cy = f.y * cell + cell / 2;
    const radius = cell * 0.29;
    ctx.save();
    ctx.fillStyle = theme.food;
    if (theme.pixelStyle) {
      const unit = Math.max(1, Math.floor(cell / 7));
      const x = Math.round(cx - unit * 2.5), y = Math.round(cy - unit * 2.5);
      ctx.fillRect(x + unit, y, unit * 3, unit * 5);
      ctx.fillRect(x, y + unit, unit * 5, unit * 3);
      ctx.fillStyle = theme.snake.eyeWhite;
      ctx.globalAlpha = 0.5;
      ctx.fillRect(x + unit, y + unit, unit, unit);
    } else {
      if (theme.glow) { ctx.shadowColor = theme.food; ctx.shadowBlur = 6; }
      ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = theme.snake.eyeWhite;
      ctx.beginPath(); ctx.arc(cx - radius * 0.27, cy - radius * 0.3, radius * 0.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  _drawSpecial(food, cell, theme) {
    const s = food.special;
    if (!s) return;
    const ctx = this.ctx;
    const cx = s.x * cell + cell / 2, cy = s.y * cell + cell / 2;
    const remain = clamp(food.specialRemaining / CONFIG.specialFood.lifetime, 0, 1);
    ctx.save();
    ctx.fillStyle = theme.special;
    if (theme.pixelStyle) {
      const unit = Math.max(1, Math.floor(cell / 9));
      const x = Math.round(cx - unit * 3.5), y = Math.round(cy - unit * 3.5);
      const rows = ['0001000', '0001000', '1111111', '0111110', '0011100', '0110110', '1100011'];
      rows.forEach((row, iy) => {
        for (let ix = 0; ix < row.length; ix++)
          if (row[ix] === '1') ctx.fillRect(x + ix * unit, y + iy * unit, unit, unit);
      });
      ctx.fillStyle = theme.text || theme.snake.eyeWhite;
      ctx.fillRect(s.x * cell + cell * 0.15, (s.y + 1) * cell - 2, cell * 0.7 * remain, 1);
    } else {
      if (theme.glow) { ctx.shadowColor = theme.special; ctx.shadowBlur = 6; }
      starPath(ctx, cx, cy, cell * 0.35, cell * 0.16, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = theme.text || theme.snake.eyeWhite;
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, cell * 0.45, -Math.PI / 2, -Math.PI / 2 + remain * Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  _bodyColor(i, len, theme) {
    const p = len > 1 ? i / (len - 1) : 0;
    if (p < 0.5) return mixColor(theme.snake.head, theme.snake.mid, p * 2);
    return mixColor(theme.snake.mid, theme.snake.tail, (p - 0.5) * 2);
  }

  _drawSnake(snake, cell, theme, ghostActive, now) {
    const ctx = this.ctx, body = snake.body, len = body.length;
    if (!len) return;
    const inset = Math.max(1, Math.round(cell * 0.07));
    ctx.save();
    if (ghostActive) ctx.globalAlpha = 0.68;
    for (let i = len - 1; i >= 1; i--) {
      const x = body[i].x * cell + inset, y = body[i].y * cell + inset;
      const size = cell - inset * 2;
      ctx.fillStyle = this._bodyColor(i, len, theme);
      if (theme.pixelStyle) {
        ctx.fillRect(x, y, size, size);
        ctx.save();
        ctx.globalAlpha *= 0.16;
        ctx.fillStyle = theme.snake.eyeWhite;
        ctx.fillRect(x + 2, y + 2, Math.max(1, Math.floor(cell * 0.15)), 1);
        ctx.restore();
      } else {
        roundRect(ctx, x, y, size, size, cell * 0.14);
        ctx.fill();
      }
      if (ghostActive) {
        ctx.strokeStyle = theme.ghost || theme.accent;
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      }
    }
    this._drawHead(snake, cell, theme, ghostActive, now);
    ctx.restore();
  }

  _drawHead(snake, cell, theme, ghostActive, now) {
    const ctx = this.ctx, head = snake.body[0], dir = snake.direction;
    const x = head.x * cell, y = head.y * cell;
    const cx = x + cell / 2, cy = y + cell / 2;
    const elapsed = Math.max(0, now - this.headPulseStarted);
    const scale = this.reducedMotion ? 1 : 1 + 0.08 * Math.max(0, 1 - elapsed / 120);
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
    ctx.fillStyle = theme.snake.head;
    if (theme.glow && !theme.pixelStyle && !ghostActive) { ctx.shadowColor = theme.snake.head; ctx.shadowBlur = 5; }
    if (theme.pixelStyle) ctx.fillRect(x, y, cell, cell);
    else { roundRect(ctx, x, y, cell, cell, cell * 0.17); ctx.fill(); }
    ctx.shadowBlur = 0;
    if (ghostActive) {
      ctx.strokeStyle = theme.ghost || theme.accent;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
    }

    // Eye positions follow the logical direction; only the drawing is scaled.
    const px = -dir.y, py = dir.x;
    const eo = cell * 0.24, fo = cell * 0.17, er = cell * 0.14, pupilR = er * 0.55;
    for (const sign of [-1, 1]) {
      const ex = cx + px * eo * sign + dir.x * fo;
      const ey = cy + py * eo * sign + dir.y * fo;
      ctx.fillStyle = theme.snake.eyeWhite;
      if (theme.pixelStyle) ctx.fillRect(Math.round(ex - er), Math.round(ey - er), Math.max(2, Math.round(er * 2)), Math.max(2, Math.round(er * 2)));
      else { ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = theme.snake.eye;
      const pupilX = ex + dir.x * pupilR * 0.6, pupilY = ey + dir.y * pupilR * 0.6;
      if (theme.pixelStyle) ctx.fillRect(Math.round(pupilX - pupilR), Math.round(pupilY - pupilR), Math.max(1, Math.round(pupilR * 2)), Math.max(1, Math.round(pupilR * 2)));
      else { ctx.beginPath(); ctx.arc(pupilX, pupilY, pupilR, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }
}

/* ============================================================
 * InputHandler 类：输入处理（键盘 / 触屏滑动 / 虚拟方向键长按）
 * ============================================================ */
class InputHandler {
  constructor(game) { this.game = game; }

  bind() {
    // 键盘
    window.addEventListener('keydown', (e) => this._onKey(e));

    // 菜单按钮
    document.getElementById('btn-start').addEventListener('click', () => this.game.startGame(this.game.difficulty));
    document.querySelectorAll('.diff-btn').forEach(b =>
      b.addEventListener('click', () => this.game.setDifficulty(b.dataset.diff)));
    document.querySelectorAll('.theme-btn').forEach(b =>
      b.addEventListener('click', () => this.game.setTheme(b.dataset.theme)));

    // 暂停 / 结束按钮
    document.getElementById('btn-pause').addEventListener('click', () => { this.game.ensureAudio(); this.game.togglePause(); });
    document.getElementById('btn-resume').addEventListener('click', () => this.game.togglePause());
    document.getElementById('btn-restart-from-pause').addEventListener('click', () => this.game.startGame(this.game.difficulty));
    document.getElementById('btn-menu-from-pause').addEventListener('click', () => this.game.backToMenu());
    document.getElementById('btn-again').addEventListener('click', () => this.game.startGame(this.game.difficulty));
    document.getElementById('btn-menu').addEventListener('click', () => this.game.backToMenu());

    document.getElementById('btn-lb-all').addEventListener('click', () => {
      this.game.leaderboardExpanded = !this.game.leaderboardExpanded;
      this.game.renderLeaderboard();
    });

    // 声音开关
    document.getElementById('btn-mute').addEventListener('click', () => this.game.toggleMute());

    // 虚拟方向键（长按连续）
    this._bindDpad();

    // 触屏滑动转向
    this._bindSwipe();

    // 游戏进行时阻止页面默认滚动
    document.addEventListener('touchmove', (e) => {
      const s = this.game.state;
      if (s === 'playing' && e.target === this.game.canvas) e.preventDefault();
    }, { passive: false });
  }

  /** 虚拟方向键：pointerdown 立即转向，长按期间定时重复发送方向（连续移动） */
  _bindDpad() {
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      let timer = null;
      const start = (e) => {
        e.preventDefault();
        this.game.ensureAudio();
        this.game.requestDirection(dir);
        if (timer) clearInterval(timer);
        timer = setInterval(() => this.game.requestDirection(dir), 120);
      };
      const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointerleave', stop);
      btn.addEventListener('pointercancel', stop);
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
    });
  }

  /** 触屏滑动：位移超过阈值则按主方向转向 */
  _bindSwipe() {
    const wrap = document.getElementById('board-wrap');
    let tsx = 0, tsy = 0;
    wrap.addEventListener('touchstart', (e) => {
      this.game.ensureAudio();
      tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
    }, { passive: true });
    wrap.addEventListener('touchmove', (e) => {
      if (this.game.state !== 'playing') return;
      const dx = e.touches[0].clientX - tsx;
      const dy = e.touches[0].clientY - tsy;
      const threshold = 24;
      if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;
      if (Math.abs(dx) > Math.abs(dy)) this.game.requestDirection(dx > 0 ? 'right' : 'left');
      else this.game.requestDirection(dy > 0 ? 'down' : 'up');
      tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
    }, { passive: true });
  }

  _onKey(e) {
    if (e.repeat && [' ', 'Spacebar', 'Escape', 'Enter'].includes(e.key)) { e.preventDefault(); return; }
    const dirMap = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right'
    };
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (this.game.state === 'playing' || this.game.state === 'paused') { this.game.ensureAudio(); this.game.togglePause(); }
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (this.game.state === 'menu' || this.game.state === 'gameover') this.game.startGame(this.game.difficulty);
      return;
    }
    if (e.key === 'Escape') {
      if (this.game.state === 'playing' || this.game.state === 'paused') this.game.togglePause();
      return;
    }
    if (dirMap[e.key]) { e.preventDefault(); this.game.ensureAudio(); this.game.requestDirection(dirMap[e.key]); }
  }
}

/* ============================================================
 * Game 类：主循环、状态管理、计分/连击/幽灵、主题、UI
 * ============================================================ */
/* Presentation-only menu interaction; uses the game's existing animation loop. */
class MenuInteraction {
  constructor(game) {
    this.game = game;
    this.menu = document.getElementById('overlay-menu');
    this.cursor = document.getElementById('berry-cursor');
    this.logo = document.getElementById('menu-wordmark');
    this.eyes = [...this.logo.querySelectorAll('.title-eye')].map(eye => ({
      element: eye, pupil: eye.querySelector('.title-pupil'), x: 0, y: 0, targetX: 0, targetY: 0
    }));
    this.finePointer = matchMedia('(any-hover: hover) and (any-pointer: fine)');
    this.active = false;
    this.lastTime = 0;
    this.mouse = { x: 0, y: 0 };
    this.menu.addEventListener('pointermove', event => this.move(event));
    this.menu.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'mouse') this.hide();
      else this.move(event);
    });
    this.menu.addEventListener('pointerleave', () => this.hide());
    this.menu.addEventListener('pointercancel', () => this.hide());
    this.menu.addEventListener('scroll', () => this.resize());
    this.menu.addEventListener('keydown', event => { if (event.key === 'Tab') this.hide(); });
    window.addEventListener('blur', () => this.hide());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.hide(); });
    this.finePointer.addEventListener('change', () => { if (!this.finePointer.matches) this.hide(); });
    this.resize();
  }
  resize() {
    const matrix = this.logo.getScreenCTM();
    if (!matrix) return;
    this.scale = Math.hypot(matrix.a, matrix.b) || 1;
    for (const eye of this.eyes) {
      const point = new DOMPoint(Number(eye.element.dataset.cx), Number(eye.element.dataset.cy)).matrixTransform(matrix);
      eye.centerX = point.x; eye.centerY = point.y;
    }
    if (this.active) this.aim();
  }
  move(event) {
    if (event.pointerType !== 'mouse' || !this.finePointer.matches || this.game.state !== 'menu') return;
    if (!this.active) this.resize();
    this.active = true;
    this.mouse.x = event.clientX; this.mouse.y = event.clientY;
    // Position updates immediately; the overlay never participates in hit testing.
    this.cursor.style.transform = `translate3d(${event.clientX - 13}px, ${event.clientY - 17}px, 0)`;
    this.cursor.classList.add('visible');
    this.menu.classList.add('has-berry-cursor');
    this.aim();
  }
  aim() {
    for (const eye of this.eyes) {
      const dx = (this.mouse.x - eye.centerX) / this.scale;
      const dy = (this.mouse.y - eye.centerY) / this.scale;
      const distance = Math.hypot(dx, dy);
      // At most four SVG units: the full pupil always remains inside its eye white.
      const amount = distance ? Math.min(4, distance * 0.045) / distance : 0;
      eye.targetX = dx * amount; eye.targetY = dy * amount;
    }
  }
  hide() {
    this.active = false;
    this.cursor.classList.remove('visible');
    this.menu.classList.remove('has-berry-cursor');
    for (const eye of this.eyes) { eye.targetX = 0; eye.targetY = 0; }
  }
  update(now) {
    if (this.game.state !== 'menu') {
      if (this.active) this.hide();
      return;
    }
    const dt = this.lastTime ? Math.min(64, Math.max(0, now - this.lastTime)) : 16;
    this.lastTime = now;
    const blend = this.game.motionPreference.matches ? 1 : 1 - Math.exp(-dt / 55);
    for (const eye of this.eyes) {
      eye.x += (eye.targetX - eye.x) * blend;
      eye.y += (eye.targetY - eye.y) * blend;
      if (Math.abs(eye.x - eye.targetX) < 0.01) eye.x = eye.targetX;
      if (Math.abs(eye.y - eye.targetY) < 0.01) eye.y = eye.targetY;
      eye.pupil.setAttribute('transform', `translate(${eye.x.toFixed(3)} ${eye.y.toFixed(3)})`);
    }
  }
}

class Game {
  constructor() {
    Storage.load();
    this.isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (this.isTouch) document.body.classList.add('touch');

    this.canvas = document.getElementById('game');
    this.renderer = new Renderer(this.canvas);
    this.input = new InputHandler(this);

    // DOM 缓存
    this.el = {
      app: document.getElementById('app'),
      statusStrip: document.getElementById('status-strip'),
      reward: document.getElementById('reward-toast'),
      specialBadge: document.getElementById('special-badge'),
      comboCount: document.getElementById('combo-count'),
      comboTime: document.getElementById('combo-time'),
      comboMeter: document.getElementById('combo-meter'),
      ghostTime: document.getElementById('ghost-time'),
      ghostMeter: document.getElementById('ghost-meter'),
      specialTime: document.getElementById('special-time'),
      specialMeter: document.getElementById('special-meter'),
      hud: document.getElementById('hud'),
      controls: document.getElementById('touch-controls'),
      boardWrap: document.getElementById('board-wrap'),
      score: document.getElementById('score'),
      highscore: document.getElementById('highscore'),
      difficulty: document.getElementById('difficulty'),
      comboBadge: document.getElementById('combo-badge'),
      ghostBadge: document.getElementById('ghost-badge'),
      menu: document.getElementById('overlay-menu'),
      countdown: document.getElementById('overlay-countdown'),
      countdownNum: document.getElementById('countdown-num'),
      pause: document.getElementById('overlay-pause'),
      gameover: document.getElementById('overlay-gameover'),
      goScore: document.getElementById('go-score'),
      goHigh: document.getElementById('go-high'),
      goTime: document.getElementById('go-time'),
      recordBadge: document.getElementById('record-badge'),
      lbList: document.getElementById('lb-list'),
      orientationHint: document.getElementById('orientation-hint')
    };

    // 状态
    this.state = 'menu';            // menu | countdown | playing | paused | gameover
    this.difficulty = 'normal';
    this.score = 0;
    this.highscore = Storage.best(this.difficulty);
    this.elapsed = 0;
    this.comboCount = 0;
    this.comboRemaining = 0;        // 连击剩余窗口（dt 递减，暂停冻结）
    this.ghostRemaining = 0;        // 幽灵模式剩余时间
    this.ghostActive = false;
    this.foodsTotal = 0;            // 本局累计吃食物数（触发幽灵模式）
    this.accumulator = 0;
    this.lastFrame = performance.now();
    this.startTime = 0;
    this.orientationDismissed = false;
    this.rewardUntil = 0;
    this.resultDueAt = 0;
    this.deathSceneNow = 0;
    this.leaderboardExpanded = false;
    this.motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    this.renderer.reducedMotion = this.motionPreference.matches;
    this.motionPreference.addEventListener('change', e => {
      this.renderer.reducedMotion = e.matches;
      if (e.matches) this.renderer.clearParticles();
    });

    this.snake = new Snake();
    this.food = new Food();
    this.obstacles = [];
    this.audio = new AudioManager();
    this.menuInteraction = new MenuInteraction(this);

    this.setTheme(Storage.theme);
    this.resize();
    this.input.bind();
    // 手机竖屏可直接游玩，不用遮罩强制旋转。
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.suspend(); });
    window.addEventListener('blur', () => this.suspend());
    this.renderLeaderboard();
    this.updateScoreUI();
    this.updateHighscoreUI();
    this.updateDifficultyUI();
    this.updateComboBadge();
    this.updateGhostBadge();

    window.addEventListener('resize', () => this.resize());
    window.addEventListener('load', () => this.resize());

    requestAnimationFrame(this.loop);
  }

  /* ---------- 主循环 ---------- */
  loop = (now) => {
    const dt = Math.min(Math.max(0, now - this.lastFrame), 100);
    this.lastFrame = now;
    this.update(dt, now);
    this.render(now);
    requestAnimationFrame(this.loop);
  };

  update(dt, now) {
    // Presentation deadlines share the existing loop; restarting cancels them.
    if (this.rewardUntil && now >= this.rewardUntil) {
      this.rewardUntil = 0;
      this.el.reward.classList.remove('show');
      this.el.reward.textContent = '';
    }
    if (this.resultDueAt && now >= this.resultDueAt) {
      this.resultDueAt = 0;
      if (this.state === 'gameover') this.showOverlay('gameover');
    }
    // 倒计时
    if (this.state === 'countdown') {
      const elapsed = Math.max(0, now - this.countdownStart);
      if (elapsed >= CONFIG.countdownMs) {
        this.audio.countdown(0);
        this.state = 'playing';
        this.startTime = now;
        this.accumulator = 0;
        this.el.countdown.classList.add('hidden');
        return;
      }
      this.showCountdownNumber(Math.max(1, Math.ceil((CONFIG.countdownMs - elapsed) / 1000)));
    }

    // 游戏进行中
    if (this.state === 'playing') {
      this.elapsed += dt / 1000;
      // 连击窗口倒计时
      if (this.comboCount > 0) {
        this.comboRemaining -= dt;
        if (this.comboRemaining <= 0) { this.comboCount = 0; this.updateComboBadge(); }
      }
      // 幽灵模式倒计时
      if (this.ghostRemaining > 0) {
        this.ghostRemaining -= dt;
        if (this.ghostRemaining <= 0) this.ghostRemaining = 0;
      }
      this.ghostActive = this.ghostRemaining > 0;
      this.updateGhostBadge();

      this.food.update(dt); // 特殊食物过期

      // 固定步长：按难度速度节流
      this.accumulator += dt;
      const interval = 1000 / CONFIG.speeds[this.difficulty];
      while (this.accumulator >= interval) {
        this.accumulator -= interval;
        this.tick();
        if (this.state !== 'playing') break;
      }

    }

    this.updateStatusUI();
    this.renderer.updateParticles(dt);
  }

  /* ---------- 单步逻辑 ---------- */
  tick() {
    const wrap = CONFIG.wallPass[this.difficulty] || this.ghostActive;
    const result = this.snake.move(this.obstacles, wrap, this.ghostActive, this.food);

    if (result === 'wall' || result === 'self' || result === 'obstacle') { this.die(result); return; }

    if (result === 'food') {
      const f = this.food.food;
      const fx = (f.x + 0.5) * this.renderer.cellSize, fy = (f.y + 0.5) * this.renderer.cellSize;
      this.gainScore(CONFIG.scoring.normal);
      this.snake.pendingGrowth += 1;
      this.renderer.burst(fx, fy, this.theme.food, 6);
      this.renderer.pulseHead();
      this.audio.eat(this.comboCount);
      this.food.onNormalEaten(this.snake, this.obstacles);
      this.onFoodEaten();
      this.checkWin();
    } else if (result === 'special') {
      const f = this.food.special;
      const fx = (f.x + 0.5) * this.renderer.cellSize, fy = (f.y + 0.5) * this.renderer.cellSize;
      this.gainScore(CONFIG.scoring.special);
      this.snake.pendingGrowth += 2;
      this.renderer.burst(fx, fy, this.theme.special, 6);
      this.renderer.pulseHead();
      this.audio.special();
      this.food.onSpecialEaten();
      this.onFoodEaten();
      this.checkWin();
    } else if (result === 'moved') {
      // 移动保持安静，保留进食和结算音效。
    }
  }

  /** 每吃一个食物调用：累计计数并触发幽灵模式 */
  onFoodEaten() {
    this.foodsTotal++;
    if (this.foodsTotal % CONFIG.ghost.every === 0) this.triggerGhost();
  }

  triggerGhost() {
    this.ghostRemaining = CONFIG.ghost.durationMs;
    this.ghostActive = true;
    this.updateGhostBadge();
    this.audio.ghost();
    const head = this.snake.body[0];
    this.renderer.burst((head.x + 0.5) * this.renderer.cellSize, (head.y + 0.5) * this.renderer.cellSize, this.theme.ghost, 4);
  }

  gainScore(base) {
    // 连击：窗口内连续吃食物递进，否则重置为 1
    if (this.comboRemaining > 0 && this.comboCount > 0) {
      this.comboCount = Math.min(this.comboCount + 1, CONFIG.scoring.comboMax);
    } else {
      this.comboCount = 1;
    }
    this.comboRemaining = CONFIG.scoring.comboWindowMs;
    const bonus = CONFIG.scoring.comboBonus * this.comboCount;
    this.score += base + bonus;
    this.updateScoreUI();
    if (bonus > 0) this.showComboPop(bonus);
    this.updateComboBadge();
    if (this.score > this.highscore) { this.highscore = this.score; this.updateHighscoreUI(); }
  }

  checkWin() {
    const occupied = new Set([...this.snake.body, ...this.obstacles].map(p => `${p.x},${p.y}`));
    if (occupied.size === CONFIG.grid * CONFIG.grid) this.die('win');
  }

  die(reason = 'self') {
    this.state = 'gameover';
    document.getElementById('result-title').textContent = reason === 'win' ? '棋盘已填满，通关！' : '游戏结束';
    document.getElementById('result-reason').textContent = ({wall: '撞到墙壁了', self: '撞到自己了', obstacle: '撞到障碍物了', win: '所有可用格子都已占满'}[reason]);
    const head = this.snake.body[0];
    this.renderer.burst((head.x + 0.5) * this.renderer.cellSize, (head.y + 0.5) * this.renderer.cellSize, this.theme.snake.head, 4);
    if (reason === 'win') this.audio.special(); else this.audio.death();

    const prevHigh = Storage.best(this.difficulty); // 本局开始前已持久化的最高分
    const isRecord = this.score > prevHigh && this.score > 0;
    Storage.saveScore(this.score, this.elapsed, this.difficulty);
    this.highscore = Storage.best(this.difficulty);
    this.updateHighscoreUI();

    this.el.goScore.textContent = this.score;
    this.el.goHigh.textContent = this.highscore;
    this.el.goTime.textContent = formatTime(this.elapsed);
    this.el.recordBadge.classList.toggle('show', isRecord);
    this.deathSceneNow = performance.now();
    this.resultDueAt = this.deathSceneNow + 200;
    this.hideOverlays();
    this.syncStateUI();
    this.renderLeaderboard();
  }

  /* ---------- 流程控制 ---------- */
  startGame(difficulty) {
    this.audio.ensure();
    this.difficulty = difficulty;
    this.updateDifficultyUI();
    this.resetRun();
    this.state = 'countdown';
    this.countdownStart = performance.now();
    this.showCountdownNumber(3);
    this.showOverlay('countdown');
  }

  showCountdownNumber(number) {
    this.el.countdownNum.textContent = String(number);
    if (this.countdownNumber === number) return;
    this.countdownNumber = number;
    this.audio.countdown(number);
  }

  resetRun() {
    this.audio.stopCountdown();
    this.countdownNumber = null;
    this.resultDueAt = 0;
    this.deathSceneNow = 0;
    this.rewardUntil = 0;
    this.el.reward.classList.remove('show');
    this.el.reward.textContent = '';
    this.snake = new Snake();
    this.food = new Food();
    this.obstacles = this._generateObstacles();
    this.food.generate(this.snake, this.obstacles);
    this.score = 0;
    this.comboCount = 0;
    this.comboRemaining = 0;
    this.ghostRemaining = 0;
    this.ghostActive = false;
    this.foodsTotal = 0;
    this.accumulator = 0;
    this.elapsed = 0;
    this.renderer.clearParticles();
    this.updateScoreUI();
    this.updateComboBadge();
    this.updateGhostBadge();
  }

  _generateObstacles() {
    const n = CONFIG.obstacles[this.difficulty] || 0;
    const g = CONFIG.grid, c = Math.floor(g / 2);
    const arr = [];
    let tries = 0;
    while (arr.length < n && tries < 2000) {
      tries++;
      const x = Math.floor(Math.random() * g), y = Math.floor(Math.random() * g);
      if (Math.abs(x - c) <= 3 && Math.abs(y - c) <= 3) continue; // 避开出生区
      if (arr.some(o => o.x === x && o.y === y)) continue;
      arr.push({ x, y });
    }
    return arr;
  }

  backToMenu() {
    this.audio.click();
    this.state = 'menu';
    this.resetRun();
    this.showOverlay('menu');
    this.renderLeaderboard();
  }

  suspend() {
    if (this.state !== 'playing' && this.state !== 'countdown') return;
    this.audio.stopCountdown();
    this.pausedFrom = this.state;
    this.countdownLeft = Math.max(0, CONFIG.countdownMs - (performance.now() - this.countdownStart));
    this.state = 'paused';
    this.snake.dirQueue = [];
    this.accumulator = 0;
    this.showOverlay('pause');
  }

  togglePause() {
    if (this.state === 'playing' || this.state === 'countdown') {
      this.suspend(); this.audio.click();
    } else if (this.state === 'paused') {
      this.lastFrame = performance.now();
      this.accumulator = 0;
      this.state = this.pausedFrom === 'countdown' ? 'countdown' : 'playing';
      if (this.state === 'countdown') {
        this.countdownStart = this.lastFrame - (CONFIG.countdownMs - this.countdownLeft);
        this.showOverlay('countdown');
      } else this.hideOverlays();
      this.audio.click();
    }
  }

  showOverlay(name) {
    this.hideOverlays();
    if (name === 'menu') this.el.menu.classList.remove('hidden');
    else if (name === 'countdown') this.el.countdown.classList.remove('hidden');
    else if (name === 'pause') this.el.pause.classList.remove('hidden');
    else if (name === 'gameover') this.el.gameover.classList.remove('hidden');
    this.syncStateUI();
    if (name === 'menu') this.drawMenuPreviews();
  }
  hideOverlays() {
    this.el.menu.classList.add('hidden');
    this.el.countdown.classList.add('hidden');
    this.el.pause.classList.add('hidden');
    this.el.gameover.classList.add('hidden');
  }

  /* ---------- 对外输入 API（供 InputHandler 调用） ---------- */
  requestDirection(name) {
    if (this.state !== 'playing') return;
    const d = DIRECTIONS[name];
    if (d) this.snake.queueDirection(d);
  }
  ensureAudio() { this.audio.ensure(); }
  toggleMute() {
    this.audio.ensure();
    this.audio.enabled = !this.audio.enabled;
    if (!this.audio.enabled) this.audio.stopCountdown();
    const button = document.getElementById('btn-mute');
    button.classList.toggle('is-muted', !this.audio.enabled);
    button.setAttribute('aria-pressed', String(!this.audio.enabled));
    button.title = this.audio.enabled ? '关闭声音' : '开启声音';
  }

  /* ---------- 难度 / 主题 ---------- */
  setDifficulty(name) {
    if (!DIFF_NAMES[name]) return;
    this.audio.ensure(); this.audio.click();
    this.difficulty = name;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === name));
    this.updateDifficultyUI();
  }
  setTheme(name) {
    if (!THEMES[name]) name = 'neon';
    this.audio.ensure(); this.audio.click();
    this.theme = THEMES[name];
    Storage.saveTheme(name);
    const vars = { accent: 'accent', bg: 'page', board: 'bg', panel: 'panel', text: 'text',
      subtext: 'subtext', border: 'border', hover: 'hover', ghost: 'ghost', food: 'food', special: 'special', overlay: 'overlay' };
    for (const [css, key] of Object.entries(vars)) document.documentElement.style.setProperty('--' + css, this.theme[key]);
    document.body.dataset.theme = name;
    document.getElementById('theme-caption').textContent = this.theme.caption;
    document.querySelectorAll('.theme-btn').forEach(b => {
      const active = b.dataset.theme === name;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', String(active));
    });
    this.drawMenuPreviews();
  }

  drawMenuScene() {
    const canvas = document.getElementById('menu-snake');
    const width = this.el.menu.clientWidth, height = this.el.menu.querySelector('.menu-card').offsetHeight;
    if (!width || !height) return;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.style.height = height + 'px';
    canvas.width = width * dpr; canvas.height = height * dpr;
    const ctx = canvas.getContext('2d'), theme = this.theme;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = theme.bg; ctx.fillRect(0, 0, width, height);
    const cell = width < 400 ? 15 : 22;
    ctx.strokeStyle = theme.grid; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = cell; x < width; x += cell) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, height); }
    for (let y = cell; y < height; y += cell) { ctx.moveTo(0, y + 0.5); ctx.lineTo(width, y + 0.5); }
    ctx.stroke();
    const renderer = new Renderer(canvas);
    renderer.cellSize = cell; renderer.reducedMotion = true;
    const headX = Math.floor(width * 0.7 / cell);
    const body = [];
    for (let x = headX; x >= 1; x--) body.push({ x, y: 1 });
    for (let y = 2; y < Math.floor(height * 0.79 / cell); y++) body.push({ x: 1, y });
    renderer._drawSnake({ body, direction: DIRECTIONS.right }, cell, theme, false, 0);
    // Decorative objects use fixed positions, independent of gameplay randomness.
    renderer._drawFood({ food: { x: Math.floor(width / cell) - 2, y: 4 } }, cell, theme);
    renderer._drawFood({ food: { x: 2, y: Math.floor(height / cell) - 2 } }, cell, theme);
    ctx.save(); ctx.fillStyle = theme.special;
    starPath(ctx, width - cell, height * 0.56, 7, 3.2, 5); ctx.fill(); ctx.restore();
    if (theme === THEMES.forest) {
      const tree = (x, y, size) => {
        ctx.fillStyle = theme.obstacleEdge; ctx.globalAlpha = 0.23;
        ctx.fillRect(x - size * 0.12, y, size * 0.24, size * 0.7);
        ctx.fillStyle = theme.snake.tail;
        ctx.fillRect(x - size * 0.25, y - size * 0.55, size * 0.5, size * 0.2);
        ctx.fillRect(x - size * 0.4, y - size * 0.35, size * 0.8, size * 0.35);
        ctx.fillRect(x - size * 0.55, y, size * 1.1, size * 0.32);
        ctx.globalAlpha = 1;
      };
      tree(width - 29, 31, 20); tree(width - 18, height * 0.73, 17); tree(19, height - 31, 21);
      ctx.fillStyle = theme.snake.tail; ctx.globalAlpha = 0.28;
      for (const [x, y] of [[width-21, height*.30],[width-20,height*.90],[15,height*.46],[47,height-25]]) {
        ctx.fillRect(x, y, 2, 6); ctx.fillRect(x-3,y-2,2,5); ctx.fillRect(x+3,y-4,2,5);
      }
      ctx.globalAlpha = 1;
    } else if (theme.pixelStyle) {
      ctx.fillStyle = theme.obstacleEdge; ctx.globalAlpha = 0.3;
      for (let i = 0; i < 20; i++) {
        const x = i % 2 ? width - 16 - (i % 3) * 5 : 10 + (i % 3) * 5;
        const y = 70 + ((i * 79) % Math.max(1, height - 95));
        ctx.fillRect(x, y, 3, 3);
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = theme.obstacleEdge; ctx.globalAlpha = 0.4;
      for (const y of [height*.28,height*.78]) {
        ctx.beginPath(); ctx.moveTo(width-8,y-16); ctx.lineTo(width-17,y-16); ctx.lineTo(width-17,y+15); ctx.lineTo(width-26,y+15); ctx.stroke();
        ctx.strokeRect(width-29,y+13,4,4);
      }
      ctx.globalAlpha = 1;
    }
    this.menuInteraction?.resize();
  }

  drawMenuPreviews() {
    // The same renderer draws miniature scenes; preview models never enter a run.
    const draw = (canvas, theme, large) => {
      const renderer = new Renderer(canvas);
      const width = large ? 240 : Math.max(60, Math.round(canvas.getBoundingClientRect().width));
      const height = large ? 48 : Math.max(28, Math.round(canvas.getBoundingClientRect().height));
      const cell = large ? 16 : Math.min(12, Math.floor(width / 9));
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = width * dpr; canvas.height = height * dpr;
      renderer.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderer.cellSize = cell; renderer.boardSize = width; renderer.reducedMotion = true;
      const headX = large ? 8 : 3;
      if (!large) renderer.ctx.translate(Math.floor((width - cell * 9) / 2), Math.floor((height - cell * 3) / 2));
      const snake = { body: Array.from({ length: large ? 5 : 3 }, (_, i) => ({ x: headX - i, y: 1 })), direction: DIRECTIONS.right };
      const food = { food: { x: large ? 11 : 5, y: 1 }, special: { x: large ? 13 : 7, y: 1 }, specialRemaining: CONFIG.specialFood.lifetime };
      renderer.ctx.fillStyle = theme.bg;
      renderer.ctx.fillRect(-width, -height, width * 3, height * 3);
      renderer.render(0, { theme, snake, food, obstacles: [], ghostActive: false });
    };
    document.querySelectorAll('.theme-preview').forEach(c => draw(c, THEMES[c.dataset.preview], false));
    this.drawMenuScene();
  }

  /* ---------- 横屏提示 ---------- */
  bindOrientation() {
    if (!this.isTouch) return;
    const mq = window.matchMedia('(orientation: portrait)');
    const update = () => {
      const portrait = mq.matches;
      this.el.orientationHint.classList.toggle('hidden', !portrait || this.orientationDismissed);
    };
    if (mq.addEventListener) mq.addEventListener('change', update);
    else if (mq.addListener) mq.addListener(update);
    document.getElementById('oh-dismiss').addEventListener('click', () => {
      this.orientationDismissed = true;
      this.el.orientationHint.classList.add('hidden');
    });
    update();
  }

  /* ---------- UI 更新 ---------- */
  updateScoreUI() { this.el.score.textContent = this.score; }
  updateHighscoreUI() { this.el.highscore.textContent = this.highscore; }
  updateDifficultyUI() {
    this.el.difficulty.textContent = DIFF_NAMES[this.difficulty];
    this.highscore = Storage.best(this.difficulty); this.updateHighscoreUI();
    document.querySelectorAll('.diff-btn').forEach(b => {
      const active = b.dataset.diff === this.difficulty;
      b.classList.toggle('active', active); b.setAttribute('aria-pressed', String(active));
    });
  }
  updateComboBadge() {
    this.el.comboBadge.classList.toggle('active', this.comboCount > 0 && this.comboRemaining > 0);
    this.el.comboCount.textContent = this.comboCount;
    this.el.comboTime.textContent = Math.max(0, this.comboRemaining / 1000).toFixed(1) + 's';
    this.el.comboMeter.style.width = clamp(this.comboRemaining / CONFIG.scoring.comboWindowMs * 100, 0, 100) + '%';
  }
  updateGhostBadge() {
    this.el.ghostBadge.classList.toggle('active', this.ghostActive);
    this.el.ghostTime.textContent = Math.max(0, this.ghostRemaining / 1000).toFixed(1) + 's';
    this.el.ghostMeter.style.width = clamp(this.ghostRemaining / CONFIG.ghost.durationMs * 100, 0, 100) + '%';
    this.el.boardWrap.classList.toggle('has-ghost', this.ghostActive);
  }

  updateStatusUI() {
    this.updateComboBadge();
    this.updateGhostBadge();
    this.el.specialBadge.classList.toggle('active', !!this.food.special);
    this.el.specialTime.textContent = Math.max(0, this.food.specialRemaining / 1000).toFixed(1) + 's';
    this.el.specialMeter.style.width = clamp(this.food.specialRemaining / CONFIG.specialFood.lifetime * 100, 0, 100) + '%';
  }

  syncStateUI() {
    if (this.state !== 'menu' && this.menuInteraction?.active) this.menuInteraction.hide();
    if (this.el.app.dataset.state !== this.state) this.el.app.dataset.state = this.state;
    const pause = document.getElementById('btn-pause');
    pause.disabled = this.state === 'menu' || this.state === 'gameover';
    pause.setAttribute('aria-label', this.state === 'paused' ? '继续游戏' : '暂停游戏');
  }
  showComboPop(bonus) {
    this.el.reward.textContent = `连吃奖励 +${bonus}`;
    this.el.reward.classList.add('show');
    this.rewardUntil = performance.now() + 500;
  }

  renderLeaderboard() {
    const list = Storage.leaderboard;
    const all = document.getElementById('btn-lb-all');
    all.classList.toggle('hidden', list.length <= 3);
    all.setAttribute('aria-expanded', String(this.leaderboardExpanded));
    all.textContent = this.leaderboardExpanded ? '收起' : '查看全部';
    if (!list.length) { this.el.lbList.innerHTML = '<div class="lb-empty">第一局，从这里开始</div>'; this.drawMenuScene(); return; }
    this.el.lbList.innerHTML = list.slice(0, this.leaderboardExpanded ? list.length : 3).map((e, i) => {
      const diff = DIFF_NAMES[e.difficulty] || '普通';
      return `<div class="lb-row"><span class="lb-rank">${i + 1}</span><span class="lb-score">${e.score}</span>
        <span class="lb-tag">${diff}</span><span class="lb-time">${formatTime(e.time)}</span><span class="lb-date">${formatDate(e.date)}</span></div>`;
    }).join('');
    this.drawMenuScene();
  }

  /* ---------- 自适应尺寸：实测占用，保证始终完整显示 ---------- */
  resize() {
    const bodyStyle = getComputedStyle(document.body);
    const gap = parseFloat(getComputedStyle(this.el.app).gap) || 0;
    const width = document.body.clientWidth - parseFloat(bodyStyle.paddingLeft) - parseFloat(bodyStyle.paddingRight);
    const height = document.body.clientHeight - parseFloat(bodyStyle.paddingTop) - parseFloat(bodyStyle.paddingBottom);
    const landscape = this.isTouch && matchMedia('(orientation: landscape) and (max-height: 600px)').matches;
    const hintH = landscape ? 0 : document.getElementById('touch-hint').offsetHeight;
    const controlsH = landscape ? 0 : this.el.controls.offsetHeight;
    const gapCount = 2 + (hintH ? 1 : 0) + (controlsH ? 1 : 0);
    const availW = width - (landscape ? 170 : 0);
    const availH = height - this.el.hud.offsetHeight - this.el.statusStrip.offsetHeight - hintH - controlsH - gap * gapCount;
    const cell = Math.max(1, Math.floor(Math.min(availW, availH, CONFIG.canvas.max) / CONFIG.grid));
    const boardSize = cell * CONFIG.grid;
    this.el.app.style.setProperty('--board-size', boardSize + 'px');
    this.el.app.classList.toggle('compact-board', boardSize < 360);
    this.renderer.resize(cell, boardSize, Math.min(window.devicePixelRatio || 1, 2));
    this.drawMenuPreviews();
  }

  /* ---------- 渲染 ---------- */
  render(now) {
    this.syncStateUI();
    this.menuInteraction.update(now);
    this.renderer.render(this.state === 'gameover' ? this.deathSceneNow : now, {
      theme: this.theme,
      snake: this.snake,
      food: this.food,
      obstacles: this.obstacles,
      ghostActive: this.ghostActive
    });
  }
}

/* ============================================================
 * 启动
 * ============================================================ */
const game = new Game();
</script>
